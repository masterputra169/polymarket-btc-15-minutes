# This file is installed as /etc/nginx/conf.d/default.conf (see Dockerfile.frontend),
# so everything outside the server block below is evaluated in nginx's http context.

# Rate limit for the report API: 10 req/s per client IP, small burst absorbed.
limit_req_zone $binary_remote_addr zone=reports:1m rate=10r/s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (inherited by all locations below; a location-level
  # --- add_header would suppress inheritance, so keep add_header here only).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Content-Security-Policy fitted to this SPA:
  #   script-src 'self'          - Vite emits external JS chunks only
  #   style-src 'unsafe-inline'  - inline styles injected by the React bundle
  #   img-src data:              - inline data-URI icons
  #   connect-src ws: wss:       - same-origin /ws WebSocket and /api/reports
  #   frame-ancestors 'none'     - dashboard must never be framed
  # Adjust if you add external fonts/CDNs/analytics.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  # No HSTS here: this server terminates plain HTTP. Add HSTS on the
  # TLS-terminating reverse proxy in front of the stack instead.

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /ws {
    proxy_pass http://bot:3099;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/reports {
    limit_req zone=reports burst=20 nodelay;
    proxy_pass http://bot:3101/reports;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/health/report {
    proxy_pass http://bot:3101/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
