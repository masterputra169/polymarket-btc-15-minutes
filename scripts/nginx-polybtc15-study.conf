server {
  listen 127.0.0.1:8082;
  server_name poly15-study.dollarkilat.xyz localhost;
  root /opt/polybtc15/study-dist;
  index index.html;

  add_header Cache-Control "no-cache, must-revalidate" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location ~ ^/data/.*\.json$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
